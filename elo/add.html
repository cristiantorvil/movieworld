<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agregar película — Cine Elo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #101116;
    --card: #181a21;
    --card-border: #2a2d38;
    --text: #EDEAE3;
    --muted: #8A8D98;
    --gold: #F2C14E;
    --gold-text: #14151A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
  }
  a.back {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
  }
  a.back:hover { color: var(--gold); }
  header {
    text-align: center;
    margin: 20px 0 28px;
  }
  header h1 {
    font-size: clamp(24px, 6vw, 32px);
    margin: 0 0 6px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .field {
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input[type="text"], input[type="number"], select {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 15px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--gold);
  }
  .results {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
  .result-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
    text-align: left;
  }
  .result-item:hover, .result-item:focus {
    border-color: var(--gold);
  }
  .result-item img {
    width: 40px;
    height: 60px;
    object-fit: cover;
    border-radius: 4px;
    background: #0b0c10;
    flex-shrink: 0;
  }
  .result-item .meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .result-item .title { font-size: 14px; font-weight: 600; }
  .result-item .year { font-size: 12px; color: var(--muted); }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
  }
  .hint button {
    background: none;
    border: none;
    color: var(--gold);
    cursor: pointer;
    font-size: 12px;
    padding: 0;
    text-decoration: underline;
  }

  .selected-card {
    display: none;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    margin-top: 8px;
  }
  .selected-card.show { display: block; }
  .selected-head {
    display: flex;
    gap: 14px;
    margin-bottom: 16px;
  }
  .selected-head img {
    width: 70px;
    height: 105px;
    object-fit: cover;
    border-radius: 6px;
    background: #0b0c10;
    flex-shrink: 0;
  }
  .selected-head .meta h2 {
    margin: 0 0 4px;
    font-size: 17px;
  }
  .selected-head .meta p {
    margin: 2px 0;
    font-size: 13px;
    color: var(--muted);
  }
  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .btn-gold {
    width: 100%;
    background: var(--gold);
    color: var(--gold-text);
    border: none;
    font-weight: 700;
    font-size: 15px;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 18px;
  }
  .btn-gold:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .btn-ghost {
    width: 100%;
    background: none;
    color: var(--muted);
    border: 1px solid var(--card-border);
    font-size: 13px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
  }
  .status {
    text-align: center;
    font-size: 14px;
    margin-top: 16px;
    min-height: 20px;
  }
  .status.ok { color: #40C057; }
  .status.err { color: #F03E3E; }

  .recent {
    margin-top: 32px;
  }
  .recent h3 {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 10px;
  }
  .recent ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .recent li {
    font-size: 13px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .recent li span {
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../index.html">← MovieWorld</a>
    <header>
      <h1>🎬 Agregar película</h1>
      <p>Busca en TMDB y se guarda directo en la Sheet — aparece en Cine Elo la próxima vez que sincronices ahí.</p>
    </header>

    <div class="field">
      <label for="search">Título</label>
      <input type="text" id="search" placeholder="Ej. Stalker" autocomplete="off" />
      <div class="results" id="results"></div>
      <p class="hint" id="hint"></p>
    </div>

    <div class="selected-card" id="selectedCard">
      <div class="selected-head">
        <img id="selPoster" alt="" />
        <div class="meta">
          <h2 id="selTitle"></h2>
          <p id="selDirector"></p>
          <p id="selGenre"></p>
          <p id="selCountry"></p>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="rating">Tu rating (opcional)</label>
          <select id="rating">
            <option value="">Sin ver / watchlist</option>
            <option value="0.5">★ 0.5</option>
            <option value="1">★ 1</option>
            <option value="1.5">★ 1.5</option>
            <option value="2">★ 2</option>
            <option value="2.5">★ 2.5</option>
            <option value="3">★ 3</option>
            <option value="3.5">★ 3.5</option>
            <option value="4">★ 4</option>
            <option value="4.5">★ 4.5</option>
            <option value="5">★ 5</option>
          </select>
        </div>
        <div class="field">
          <label for="plays">Veces vista</label>
          <input type="number" id="plays" min="0" value="1" />
        </div>
      </div>

      <button class="btn-gold" id="saveBtn">Guardar en la Sheet</button>
      <button class="btn-ghost" id="cancelBtn">elegir otra</button>
      <p class="status" id="status"></p>
    </div>

    <div class="recent" id="recentWrap" style="display:none;">
      <h3>Agregadas en esta sesión</h3>
      <ul id="recentList"></ul>
    </div>
  </div>

<script>
// Pantalla de error amigable ante cualquier excepción no capturada (mismo
// criterio que el ErrorBoundary de Cine Elo/index.html). Va afuera del IIFE
// de abajo a propósito, para cubrir errores incluso antes de que corra.
(function () {
  var shown = false;
  function showFatalError() {
    if (shown) return;
    shown = true;
    var overlay = document.createElement("div");
    overlay.style.cssText =
      "position:fixed;inset:0;background:#101116;color:#EDEAE3;display:flex;" +
      "flex-direction:column;align-items:center;justify-content:center;gap:16px;" +
      "padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;" +
      "text-align:center;z-index:9999;";
    overlay.innerHTML =
      '<p style="font-size:18px;font-weight:700;margin:0;">Algo se rompió 🎬💥</p>' +
      '<p style="font-size:13px;color:#8A8D98;max-width:320px;margin:0;">Tu progreso sigue guardado. Recargá la página para volver a intentarlo.</p>' +
      '<button style="background:#F2C14E;color:#14151A;border:none;font-weight:700;' +
      'font-size:14px;padding:12px 20px;border-radius:8px;cursor:pointer;">Recargar</button>';
    overlay.querySelector("button").onclick = function () { location.reload(); };
    document.body.appendChild(overlay);
  }
  window.addEventListener("error", showFatalError);
  window.addEventListener("unhandledrejection", showFatalError);
})();

(function () {
  var SYNC_URL = "https://script.google.com/macros/s/AKfycbxj4NLejc7vBU17MyuJefuEA8YbjdP0czUNlGN6u96U_fYb1czZMkhUM2k_Y0gpBU0aQg/exec";
  var TMDB_POSTER_BASE = "https://image.tmdb.org/t/p/w200";

  // Mismo criterio que edit.html: los duelos de index.html son
  // instantáneos porque juegan contra su copia local en localStorage y
  // sincronizan al Sheet en segundo plano. Guardar una peli nueva hace lo
  // mismo acá — se agrega al toque al mismo localStorage (mismo dominio,
  // mismo storage que index.html) y el POST al Sheet pasa sin bloquear.
  var STORAGE_KEY = "cine-elo-movies";

  function uid() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function readLocalMovies() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : null;
    } catch (e) {
      return null;
    }
  }

  function writeLocalMovies(movies) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
    } catch (e) {
      // almacenamiento lleno o bloqueado: no es crítico, seguimos igual
    }
  }

  // Apps Script falla de forma intermitente: a veces devuelve una página de
  // error genérica de Google (200 OK con HTML, no JSON) y a veces el pedido
  // queda colgado sin responder nunca — fetch() no tiene timeout propio, así
  // que sin esto un guardado en segundo plano podría quedar esperando para
  // siempre. keepalive evita que el navegador lo cancele si el usuario
  // navega a otra página (ej. "← MovieWorld") antes de que termine.
  function fetchJsonWithRetry(url, options, retries, timeoutMs) {
    if (retries == null) retries = 2;
    if (timeoutMs == null) timeoutMs = 10000;
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, timeoutMs);
    var fetchOptions = Object.assign({}, options, { signal: controller.signal, keepalive: true });
    return fetch(url, fetchOptions)
      .then(function (r) { return r.json(); })
      .finally(function () { clearTimeout(timer); })
      .catch(function (err) {
        if (retries <= 0) throw err;
        return new Promise(function (resolve) { setTimeout(resolve, 500); }).then(
          function () { return fetchJsonWithRetry(url, options, retries - 1, timeoutMs); }
        );
      });
  }

  // Igual que en edit.html: keepalive es "mejor esfuerzo" (no sobrevive a
  // cerrar el navegador entero, ni a un cuelgue más largo de lo que
  // tolera). Esta cola es la garantía real — vive en IndexedDB (no
  // localStorage) porque el Service Worker (sw.js) que la reintenta en
  // segundo plano vía Background Sync, incluso con todas las pestañas
  // cerradas, no tiene acceso a localStorage. Misma base que edit.html.
  var IDB_NAME = "cine-elo-db";
  var IDB_STORE = "pendingSync";

  function idbOpen() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () {
        req.result.createObjectStore(IDB_STORE, { keyPath: "id" });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function enqueuePendingSync(item) {
    item.id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(item);
        tx.oncomplete = function () { resolve(item.id); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function readPendingSync() {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readonly");
        var req = tx.objectStore(IDB_STORE).getAll();
        req.onsuccess = function () { resolve(req.result || []); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function removePendingSync(id) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).delete(id);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  // Guardados de una versión anterior (antes de migrar a IndexedDB) pueden
  // haber quedado en el localStorage viejo — los movemos una sola vez para
  // no perderlos.
  function migrateOldPendingSync() {
    try {
      var raw = localStorage.getItem("cine-elo-pending-sync");
      if (!raw) return Promise.resolve();
      var items = JSON.parse(raw) || [];
      localStorage.removeItem("cine-elo-pending-sync");
      return Promise.all(items.map(function (item) {
        delete item.id;
        return enqueuePendingSync(item);
      }));
    } catch (e) {
      return Promise.resolve(); // nada que migrar o storage bloqueado
    }
  }

  // Le pide al navegador que reintente en segundo plano vía Service
  // Worker — incluso con TODAS las pestañas de Cine Elo cerradas, en
  // cuanto haya conexión. Si el navegador no soporta Background Sync
  // (ej. Safari/iPhone) no hace nada acá: igual queda el reintento al
  // abrir cualquier página y el intervalo de abajo como red de contención.
  function requestBackgroundSync() {
    if (!("serviceWorker" in navigator) || !("SyncManager" in window)) return;
    navigator.serviceWorker.ready
      .then(function (reg) { return reg.sync.register("flush-pending-sync"); })
      .catch(function () {});
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  function syncPendingItem(item) {
    // Esta cola es compartida (misma IndexedDB "cine-elo-db") entre las 4
    // páginas — un item "setFields"/"deleteMovie" puede haber sido encolado
    // desde edit.html/watchlist.html y drenado desde acá si ambas pestañas
    // están abiertas, así que este handler tiene que soportar todos los
    // tipos igual, no solo "create".
    if (item.type === "setFields") {
      return fetchJsonWithRetry(
        SYNC_URL +
          "?action=setFields&tmdbId=" + encodeURIComponent(item.tmdbId || "") +
          "&title=" + encodeURIComponent(item.title || "") +
          "&year=" + encodeURIComponent(item.year || "") +
          "&changes=" + encodeURIComponent(JSON.stringify(item.changes)),
        {}
      );
    }
    if (item.type === "deleteMovie") {
      return fetchJsonWithRetry(SYNC_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ type: "deleteMovie", tmdbId: item.tmdbId || "", title: item.title, year: item.year }),
      });
    }
    if (item.type === "create") {
      return fetchJsonWithRetry(SYNC_URL + "?allowCreate=1", {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify([item.payload]),
      });
    }
    return Promise.reject(new Error("tipo de pending sync desconocido: " + item.type));
  }

  // Se llama al cargar la página, cada vez que se encola un guardado
  // nuevo, y cada FLUSH_INTERVAL_MS mientras esta pestaña siga abierta
  // (red de contención para navegadores sin Background Sync). No bloquea
  // nada ni se le avisa al usuario, mismo trato silencioso que la
  // sincronización de un duelo.
  function flushPendingSync() {
    readPendingSync().then(function (queue) {
      queue.forEach(function (item) {
        syncPendingItem(item)
          .then(function (data) {
            if (data && data.ok) removePendingSync(item.id);
          })
          .catch(function () {
            // sigue en la cola: se reintenta la próxima vez.
          });
      });
    });
  }

  var FLUSH_INTERVAL_MS = 20000;
  setInterval(flushPendingSync, FLUSH_INTERVAL_MS);

  function posterUrl(path) {
    if (!path) return "";
    return TMDB_POSTER_BASE + (path.charAt(0) === "/" ? path : "/" + path);
  }
  var START_ELO = 1200;
  var META_FIELD_KEYS = [
    "director", "genre", "poster", "country", "originalLanguage",
    "runtime", "overview", "collection", "productionCompanies",
    "voteAverage", "voteCount", "cast", "tagline", "backdrop", "imdbId",
  ];

  var searchInput = document.getElementById("search");
  var resultsEl = document.getElementById("results");
  var hintEl = document.getElementById("hint");
  var selectedCard = document.getElementById("selectedCard");
  var selPoster = document.getElementById("selPoster");
  var selTitle = document.getElementById("selTitle");
  var selDirector = document.getElementById("selDirector");
  var selGenre = document.getElementById("selGenre");
  var selCountry = document.getElementById("selCountry");
  var ratingSel = document.getElementById("rating");
  var playsInput = document.getElementById("plays");
  var saveBtn = document.getElementById("saveBtn");
  var cancelBtn = document.getElementById("cancelBtn");
  var statusEl = document.getElementById("status");
  var recentWrap = document.getElementById("recentWrap");
  var recentList = document.getElementById("recentList");

  var current = null; // detalles de TMDB de la peli elegida
  var searchTimer = null;

  function computeInitialElo(rating, plays) {
    var r = typeof rating === "number" ? rating : 2.5;
    var p = typeof plays === "number" ? plays : 1;
    var ratingBonus = (r - 2.5) * 100;
    var playsBonus = Math.min(p - 1, 10) * 10;
    return Math.round(START_ELO + ratingBonus + playsBonus);
  }

  function clearResults() {
    resultsEl.innerHTML = "";
  }

  function renderResults(results) {
    clearResults();
    if (!results.length) {
      hintEl.innerHTML = "Sin resultados en TMDB. " +
        '<button type="button" id="manualBtn">Agregar igual, a mano</button>';
      document.getElementById("manualBtn").onclick = function () {
        selectManual(searchInput.value.trim());
      };
      return;
    }
    hintEl.textContent = "";
    results.forEach(function (r) {
      var item = document.createElement("button");
      item.type = "button";
      item.className = "result-item";
      var img = r.poster
        ? '<img src="' + posterUrl(r.poster) + '" alt="" />'
        : '<img alt="" />';
      item.innerHTML =
        img +
        '<span class="meta"><span class="title"></span><span class="year"></span></span>';
      item.querySelector(".title").textContent = r.title;
      item.querySelector(".year").textContent = r.year || "";
      item.onclick = function () { selectFromSearch(r.tmdbId); };
      resultsEl.appendChild(item);
    });
  }

  function doSearch(query) {
    if (!query || query.length < 2) {
      clearResults();
      hintEl.textContent = "";
      return;
    }
    hintEl.textContent = "Buscando…";
    fetchJsonWithRetry(SYNC_URL + "?action=tmdbSearch&query=" + encodeURIComponent(query), {})
      .then(function (data) {
        if (data.ok) renderResults(data.results || []);
        else hintEl.textContent = "Error buscando en TMDB.";
      })
      .catch(function () {
        hintEl.textContent = "No se pudo conectar con el backend.";
      });
  }

  searchInput.addEventListener("input", function () {
    clearTimeout(searchTimer);
    var q = searchInput.value.trim();
    searchTimer = setTimeout(function () { doSearch(q); }, 350);
  });

  function selectFromSearch(tmdbId) {
    hintEl.textContent = "Cargando detalles…";
    fetchJsonWithRetry(SYNC_URL + "?action=tmdbDetails&id=" + encodeURIComponent(tmdbId), {})
      .then(function (data) {
        if (!data.ok) {
          hintEl.textContent = "No se pudieron traer los detalles.";
          return;
        }
        current = {
          tmdbId: tmdbId,
          title: data.title || searchInput.value.trim(),
          year: data.year || "",
        };
        META_FIELD_KEYS.forEach(function (k) {
          current[k] = data[k] || "";
        });
        showSelected();
      })
      .catch(function () {
        hintEl.textContent = "No se pudo conectar con el backend.";
      });
  }

  function selectManual(title) {
    current = { tmdbId: "", title: title, year: "" };
    META_FIELD_KEYS.forEach(function (k) {
      current[k] = "";
    });
    showSelected();
  }

  function showSelected() {
    selPoster.src = posterUrl(current.poster);
    selTitle.textContent = current.title + (current.year ? " (" + current.year + ")" : "");
    selDirector.textContent = current.director || "Director desconocido";
    selGenre.textContent = current.genre || "";
    selCountry.textContent = current.country || "";
    ratingSel.value = "";
    playsInput.value = "1";
    statusEl.textContent = "";
    statusEl.className = "status";
    selectedCard.classList.add("show");
    selectedCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  cancelBtn.onclick = function () {
    current = null;
    selectedCard.classList.remove("show");
    searchInput.value = "";
    clearResults();
    searchInput.focus();
  };

  saveBtn.onclick = function () {
    if (!current) return;
    var ratingVal = ratingSel.value ? Number(ratingSel.value) : 0;
    var playsVal = ratingSel.value ? Math.max(Number(playsInput.value) || 1, 1) : 0;

    var payload = {
      title: current.title,
      tmdbId: current.tmdbId,
      year: current.year,
      rating: ratingVal,
      plays: playsVal,
      elo: computeInitialElo(ratingVal, playsVal || 1),
      games: 0,
      wins: 0,
      losses: 0,
      ties: 0,
    };
    META_FIELD_KEYS.forEach(function (k) {
      payload[k] = current[k];
    });

    // Local-first, igual que los duelos de index.html: la agregamos ya
    // mismo a su mismo localStorage y mostramos "Guardada ✓" al instante —
    // el POST al Sheet (el que de verdad tarda 3-4s, o a veces se cuelga
    // por la inestabilidad de Apps Script) pasa en segundo plano, sin que
    // el usuario tenga que esperarlo.
    var localMovies = readLocalMovies() || [];
    // tmdbId es el identificador primario: dos pelis homónimas con distinto
    // tmdbId (ej. "Wuthering Heights" 1939 vs 2011) no deben pisarse entre
    // sí. Fallback a título exacto solo si ninguna de las dos tiene tmdbId.
    var existingIdx = current.tmdbId
      ? localMovies.findIndex(function (m) { return String(m.tmdbId) === String(current.tmdbId); })
      : localMovies.findIndex(function (m) { return !m.tmdbId && m.title === current.title; });
    var localMovie = {
      id: existingIdx !== -1 ? localMovies[existingIdx].id : uid(),
      title: current.title,
      year: current.year || null,
      rating: ratingVal,
      plays: playsVal,
      elo: computeInitialElo(ratingVal, playsVal || 1),
      comparisons: 0,
      wins: 0,
      tmdbId: current.tmdbId || "",
    };
    META_FIELD_KEYS.forEach(function (k) {
      localMovie[k] = current[k] || "";
    });
    if (existingIdx !== -1) {
      localMovies[existingIdx] = localMovie;
    } else {
      localMovies.push(localMovie);
    }
    writeLocalMovies(localMovies);

    statusEl.textContent = "Guardada ✓";
    statusEl.className = "status ok";
    addToRecent(current.title, current.year);
    setTimeout(function () {
      current = null;
      selectedCard.classList.remove("show");
      searchInput.value = "";
      clearResults();
      searchInput.focus();
    }, 700);

    // Encolado ANTES de intentar mandarlo: si el intento de abajo falla, se
    // cuelga, o no llega a correr porque el usuario ya cerró la página, la
    // peli sigue anotada en IndexedDB. requestBackgroundSync hace que el
    // navegador la reintente solo en cuanto haya conexión, aunque se
    // cierren todas las pestañas de Cine Elo.
    enqueuePendingSync({ type: "create", payload: payload }).then(function (pendingId) {
      requestBackgroundSync();
      syncPendingItem({ type: "create", payload: payload })
        .then(function (data) {
          var reallySaved =
            data.ok &&
            ((data.created && data.created.length > 0) ||
              (data.updated && data.updated.length > 0));
          if (reallySaved) {
            removePendingSync(pendingId);
          } else {
            console.error('Sync en segundo plano falló para "' + payload.title + '" (queda pendiente, Background Sync reintentará):', data && data.error);
          }
        })
        .catch(function (err) {
          console.error('Sync en segundo plano falló para "' + payload.title + '" (queda pendiente, Background Sync reintentará):', err);
        });
    });
  };

  function addToRecent(title, year) {
    recentWrap.style.display = "block";
    var li = document.createElement("li");
    li.innerHTML = "🎬 " + title + " <span>" + (year || "") + "</span>";
    recentList.insertBefore(li, recentList.firstChild);
  }

  searchInput.focus();
  migrateOldPendingSync().then(flushPendingSync);
})();
</script>
</body>
</html>
